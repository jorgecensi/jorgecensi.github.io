      const heard = right.slice();
      heard[deg] = bad;
      return {
        kind: 'wrong-note', scaleType: 'Major', rootPc: root,
        midis: right, extraMidis: [bad],
        events: noteEvents(heard, 0.32, 0.34),
        tag: 'Spot the wrong note',
        prompt: `One note of this ${NOTE_NAMES[root]} major scale is off. Which one?`,
        choices: [1, 2, 3, 4, 5, 6].map(d => ({ id: String(d), label: ORDINALS[d] })),
        answer: String(deg),
        explain: `The ${ORDINALS[deg]} should be ${NOTE_NAMES[right[deg] % 12]}, not ${NOTE_NAMES[bad % 12]}.`,
        reveal: () => {
          revealNoteKeys({ midis: right });
          const good = document.querySelector(`.key[data-midi="${right[deg]}"]`);
          const wrong = document.querySelector(`.key[data-midi="${bad}"]`);
          if (good) good.classList.add('quiz-correct');
          if (wrong) wrong.classList.add('quiz-wrong');
        },
      };
    }

    // "Name that meter": a tune plays with no clicks, only the slight weight
    // a player puts on each bar's first note. 2/4 and 4/4 both group beats
    // in twos, so either counts for a duple tune.
    function makeSongMeterQuestion(spec) {
      const song = pick(METER_SONGS.filter(s => spec.meters.includes(s.meter)));
      const offs = song.notes.filter(([o]) => o != null).map(([o]) => o);
      const start = tuneStart(offs, 52, 62);
      const bar = METERS[song.meter].beats;
      const beat = song.beat * (0.88 + Math.random() * 0.24);   // a new tempo each time
      const events = [];
      let pos = -song.pickup;
      song.notes.forEach(([off, beats]) => {
        if (off != null) {
          const inBar = ((pos % bar) + bar) % bar;
          const acc = Number.isInteger(inBar) ? METERS[song.meter].accents[inBar] : -1;
          events.push({ t: (pos + song.pickup) * beat, notes: [midiToNoteName(start + off)],
                        vel: acc === 2 ? 0.8 : acc === 1 ? 0.68 : acc === 0 ? 0.62 : 0.56,
                        dur: beats * beat * 0.92 });
        }
        pos += beats;
      });
      const accept = [...new Set([...soundsAlike(song.meter, spec.meters), ...(song.also || [])])]
        .filter(m => spec.meters.includes(m));
      return {
        kind: 'meter-song', meter: song.meter,
        midis: [...new Set(offs.map(o => start + o))],
        events,
        tag: '♪ Name that meter',
        prompt: 'No clicks this time — feel the strong beat in the tune. What is the time signature?',
        choices: spec.meters.map(m => ({ id: m, label: m })),
        answer: song.meter,
        accept,
        explain: `“${song.name}” is in ${song.meter}: ${song.count}.` +
                 (METER_FEEL[song.meter] ? ` ${METER_FEEL[song.meter]}.` : song.meter === '3/4' ? ' ONE-two-three, like a waltz.' : '') +
                 alikeNote(accept),
      };
    }

    // "Real song": a recording plays in the round (on demand, from YouTube)
    // and the learner names its meter. Online only, and never in a timed run.
    function makeVideoMeterQuestion(spec) {
      const p = pick(METER_POP.filter(x => spec.meters.includes(x.meter)));
      const accept = soundsAlike(p.meter, spec.meters);
      return {
        kind: 'meter-video', meter: p.meter, video: p,
        events: [],
        tag: '▶ Real song',
        prompt: `Count along to “${p.title}” — what is the time signature?`,
        choices: spec.meters.map(m => ({ id: m, label: m })),
        answer: p.meter,
        accept,
        explain: `“${p.title}” is written in ${p.meter}.` +
                 (METER_FEEL[p.meter] ? ` ${METER_FEEL[p.meter]}.` : p.meter === '3/4' ? ' ONE-two-three: a waltz pulse.' : '') +
                 alikeNote(accept),
      };
    }

    // The round's recording, in place of the Play button's synth prompt.
    function showRoundVideo(q) {
      const box = document.getElementById('learn-video');
      if (state.mode !== 'learn' || box.querySelector('iframe')) return;
      box.hidden = false;
      toggleVideo(box, box, q.video);
    }

    function clearRoundVideo() {
      const box = document.getElementById('learn-video');
      box.innerHTML = '';
      box.hidden = true;
    }

    // Count the bars: low accented downbeats, 2 to 4 of them.
    function makeCountQuestion(meters) {
      const meter = pick(meters);
      const count = 2 + Math.floor(Math.random() * 3);
      return {
        kind: 'count', meter, count,
        tag: 'Count the bars',
        prompt: `How many bars of ${meter} do you hear?`,
        choices: ['2', '3', '4'].map(n => ({ id: n, label: n })),
        answer: String(count),
        explain: `${count} bars — count the low accented downbeats.`,
      };
    }

    // Play-by-ear: the interval sounds, the first note is lit, play the second.
    function makeBlindIntervalPlayQuestion(semisPool) {
      const q = makeIntervalPlayQuestion(semisPool);
      q.events = noteEvents(q.midis, 0.8, 1.0);
      q.tag = 'By ear';
      q.prompt = `Play the second note you hear — the first is the lit ${NOTE_NAMES[q.rootMidi % 12]}`;
      return q;
    }

    // Up-tunes where `0 → +n` happens somewhere, and where (index k).
    function phraseCandidates(semisPool) {
      return semisPool.map(n => {
        const ref = INTERVAL_REFS.up[n];
        if (!ref || ref.tune.figure) return null;
        const notes = ref.tune.notes;
        const k = notes.findIndex((x, i) => i < notes.length - 1 && x[0] === 0 && notes[i + 1][0] === n);
        return k < 0 ? null : { n, tune: ref.tune, k };
      }).filter(Boolean);
    }

    // Finish the phrase: hear the tune, then its lead-in up to the lit key,
    // and play the note that comes next.
    function makePhraseQuestion(semisPool) {
      const c = pick(phraseCandidates(semisPool));
      const offs = c.tune.notes.map(x => x[0]);
      const root = tuneStart(offs, 55, 65);
      const q = makeIntervalPlayQuestion([c.n]);
      const target = root + c.n;
      const full = tuneEvents(c.tune, root);
      const leadIn = tuneEvents({ notes: c.tune.notes.slice(0, c.k + 1) }, root);
      const gap = eventsEnd(full) + 0.7;
      return Object.assign(q, {
        low: root, high: target, rootMidi: root, targetMidi: target, midis: [root, target],
        answerPcs: new Set([root % 12, target % 12]), needPcs: new Set([target % 12]),
        givenMidis: [root], exactMidi: target, focusMidi: root + Math.round(c.n / 2),
        extraMidis: offs.map(o => root + o),
        events: [...full, ...leadIn.map(e => ({ ...e, t: e.t + gap }))],
        tag: `♪ Finish the phrase: ${c.tune.name}`,
        prompt: `Play the note that comes after the lit key (${c.tune.cue}).`,
        answerName: `${NOTE_NAMES[target % 12]} — ${anA(INTERVAL_NAMES[c.n])} ${INTERVAL_NAMES[c.n]} above ${NOTE_NAMES[root % 12]}`,
      });
    }

    // Complete the chord: the lit keys are part of it, add the missing note
    // (the 3rd decides major vs minor; the 7th makes a 7 chord).
    function makeChordCompleteQuestion(spec) {
      const type = pick(spec.types);
      const root = pick(LEARN_ROOTS);
      const q = makeChordQuestion(root, type, LEARN_RANGE);
      const missIdx = q.midis.length === 4 ? 3 : 1;
      const missing = q.midis[missIdx];
      const given = q.midis.filter((_, k) => k !== missIdx);
      return Object.assign(q, {
        givenMidis: given,
        needPcs: new Set([missing % 12]),
        events: [{ t: 0, notes: given.map(midiToNoteName), vel: 0.8, dur: 1.4 }],
        focusMidi: q.midis[0] + 5,
        tag: 'Complete the chord',
        prompt: missIdx === 3
          ? `Make it a ${NOTE_NAMES[root]} ${type}: the lit keys are a major chord. Add the missing note.`
          : `Make it ${NOTE_NAMES[root]} ${type}: the lit keys are its root and 5th. Add the missing note.`,
        answerName: `${NOTE_NAMES[root]} ${type}: add ${NOTE_NAMES[missing % 12]}`,
      });
    }

    // A scale with one note left silent: play the missing one.
    function makeMissingNoteQuestion(spec) {
      const type = pick(spec.types);
      const root = pick(spec.roots || LEARN_ROOTS);
      const q = makeScaleQuestion(root, type, LEARN_RANGE, true);
      const gap = 1 + Math.floor(Math.random() * (q.midis.length - 2));   // never the root or octave
      const missing = q.midis[gap];
      return Object.assign(q, {
        givenMidis: [q.midis[0]],
        needPcs: new Set([missing % 12]),
        events: noteEvents(q.midis, 0.32, 0.3).filter((_, k) => k !== gap),
        focusMidi: q.midis[0] + 5,
        tag: 'Missing note',
        prompt: `One note is silent in this ${NOTE_NAMES[root]} ${type} scale. Play it.`,
        answerName: `${NOTE_NAMES[missing % 12]}, note ${gap + 1} of ${NOTE_NAMES[root]} ${type}`,
      });
    }

    // Sing the answer: like the keyboard round, but judged from the mic. Any
    // octave counts, since voices sit at different heights.
    function makeSingQuestion(semisPool, root) {
      const q = makeIntervalPlayQuestion(semisPool, root);
      const name = INTERVAL_NAMES[q.semis];
      q.kind = 'sing';
      q.tag = 'Sing it';
      q.prompt = `Sing ${anA(name)} ${name} above the lit ${NOTE_NAMES[q.rootMidi % 12]} (any octave), or tap it`;
      return q;
    }

    // [variant, weight]: the standard round stays the most common.
    const LEARN_VARIANTS = {
      hear: {
        interval: [['standard', 3], ['song', 1], ['odd', 1]],
        chord:    [['standard', 3], ['song', 1], ['odd', 1]],
        scale:    [['standard', 3], ['odd', 1], ['wrong-note', 1]],
        meter:    [['standard', 1], ['song', 3], ['video', 1], ['count', 1]],
      },
      play: {
        interval: [['standard', 2], ['blind', 1], ['phrase', 1]],
        chord:    [['standard', 2], ['complete', 1]],
        scale:    [['standard', 2], ['missing', 1]],
      },
    };

    function variantAvailable(u, step, v) {
      const spec = u[step];
      const idx = LEARN_UNITS.indexOf(u);
      if (v === 'standard' || v === 'count' || v === 'blind' || v === 'complete' || v === 'missing') return true;
      if (v === 'song') {
        if (spec.type === 'meter') return METER_SONGS.some(s => spec.meters.includes(s.meter));
        return spec.type === 'interval' ? songIntervalCandidates(spec).length > 0
          : spec.type === 'chord' && songChordCandidates(spec.types, idx).length > 0;
      }
      if (v === 'odd') return (spec.semis || spec.types || []).length >= 2;
      if (v === 'wrong-note') return spec.type === 'scale' && spec.types.includes('Major');
      if (v === 'phrase') return phraseCandidates(spec.semis).length > 0;
      if (v === 'video') return spec.type === 'meter' && navigator.onLine;
      return false;
    }

    function pickWeighted(pairs) {
      const total = pairs.reduce((s, [, w]) => s + w, 0);
      let r = Math.random() * total;
      for (const [v, w] of pairs) { if ((r -= w) < 0) return v; }
      return pairs[pairs.length - 1][0];
    }

    function chooseVariant(u, step, inRun = false) {
      const list = (LEARN_VARIANTS[step][u[step].type] || [['standard', 1]])
        .filter(([v]) => variantAvailable(u, step, v) && !(inRun && v === 'video'));
      if (state.forcedVariant && list.some(([v]) => v === state.forcedVariant)) return state.forcedVariant;
      return pickWeighted(list);
    }

    function buildVariant(u, step, variant, inRun) {
      const spec = u[step];
      switch (variant) {
        case 'song':       return spec.type === 'interval' ? makeSongIntervalQuestion(spec)
                             : spec.type === 'meter'       ? makeSongMeterQuestion(spec)
                                                           : makeSongChordQuestion(spec, LEARN_UNITS.indexOf(u));
        case 'odd':        return makeOddOneOutQuestion(spec);
        case 'wrong-note': return makeWrongNoteQuestion();
        case 'count':      return makeCountQuestion(spec.meters);
        case 'video':      return makeVideoMeterQuestion(spec);
        case 'blind':      return makeBlindIntervalPlayQuestion(spec.semis);
        case 'phrase':     return makePhraseQuestion(spec.semis);
        case 'complete':   return makeChordCompleteQuestion(spec);
        case 'missing':    return makeMissingNoteQuestion(spec);
        default:           return makeStandardLearnQuestion(u, step, inRun);
      }
    }

    // `inRun`: a boss or daily round (no singing, no named warm-up rounds).
    function makeLearnQuestion(u, step, inRun = false) {
      const spec = u[step];
      let q;
      if (step === 'play' && spec.type === 'interval' && progress.settings.sing && !inRun) {
        q = makeSingQuestion(spec.semis);
        q.variant = 'sing';
      } else {
        // The first few play rounds name what to build: always the standard one.
        const warmUp = step === 'play' && !inRun && unitProgress(u.id).play.total < LEARN_NAME_ROUNDS;
        const variant = warmUp && !state.forcedVariant ? 'standard' : chooseVariant(u, step, inRun);
        q = buildVariant(u, step, variant, inRun);
        q.variant = variant;
      }
      q.unitId = u.id;
      return q;
    }

    function startLearnRound() {
      const step = state.learnStep;
      if (state.mode !== 'learn' || state.learnRun || (step !== 'hear' && step !== 'play')) return;
      state.learnJustPassed = false;
      document.getElementById('learn-next-btn').textContent = 'Next';
      beginRound(makeLearnQuestion(LEARN_UNITS[state.learnUnitIdx], step));
      renderLearnMeter();
    }

    // Round UI that only Learn has: run bar, sing meter, combo, facts.
    function learnRoundShown(q) {
      const run = state.learnRun;
      document.getElementById('learn-fact').hidden = true;
      document.getElementById('learn-result').hidden = true;
      document.getElementById('learn-round').classList.remove('is-answered');
      if (run) document.getElementById('learn-hint-btn').hidden = true;   // no hints against a boss
      const tag = document.getElementById('learn-tag');
      tag.textContent = q.tag || '';
      tag.hidden = !q.tag;
      // A recording round plays its own video, so the synth Play button goes.
      document.querySelector('#learn-round .learn-play-wrap').style.display = q.video ? 'none' : '';
      document.getElementById('learn-instrument').style.display = q.video ? 'none' : '';
      renderRunBar();
      renderCombo(false);
      const singBox = document.getElementById('learn-sing');
      singBox.hidden = q.kind !== 'sing';
      if (q.kind === 'sing') {
        qEl('options').textContent = '🎤 Sing it, or tap the key on the piano below';
        startSinging(q);
      } else {
        stopSinging();
      }
    }

    // The result card under the answers: verdict, fact, songs.
    function showLearnResult() {
      const box = document.getElementById('learn-result');
      box.hidden = false;
      document.getElementById('learn-round').classList.add('is-answered');
      requestAnimationFrame(() => revealInPanel(document.getElementById('learn-next-btn')));
    }

    // ── Learn: XP, combos and feedback flourishes ──

    const XP_PER_ANSWER = 10;
    const COMBO_STEP = 5;          // every 5 in a row raises the multiplier…
    const COMBO_MAX_MULT = 4;      // …up to x4
    const comboMultiplier = (c) => Math.min(COMBO_MAX_MULT, 1 + Math.floor(c / COMBO_STEP));

    // Update the combo and XP for one counted answer; returns the XP earned.
    function awardAnswer(correct) {
      if (!correct) {
        state.learnCombo = 0;
        renderCombo(false);
        return 0;
      }
      state.learnCombo++;
      const gained = XP_PER_ANSWER * comboMultiplier(state.learnCombo);
      progress.learn.xp += gained;
      progress.learn.bestCombo = Math.max(progress.learn.bestCombo, state.learnCombo);
      renderCombo(true);
      glowAnswerKeys();
      if (state.learnCombo % COMBO_STEP === 0) {
        playSting('combo', state.learnCombo);
        showBanner(`⚡ ${state.learnCombo} in a row! XP x${comboMultiplier(state.learnCombo)}`);
      }
      renderLearnStats();
      return gained;
    }

    function renderCombo(pop) {
      const el = document.getElementById('learn-combo');
      const c = state.learnCombo;
      el.textContent = c >= 2 ? `⚡ ${c} in a row` + (comboMultiplier(c) > 1 ? ` · x${comboMultiplier(c)}` : '') : '';
      el.classList.remove('pop');
      if (pop && c >= 2) { void el.offsetWidth; el.classList.add('pop'); }
    }

    function glowAnswerKeys() {
      const keys = document.querySelectorAll('.key.quiz-correct, .key.iv-a, .key.iv-b, .key.is-root, .key.in-scale');
      keys.forEach(k => { k.classList.remove('key-glow'); void k.offsetWidth; k.classList.add('key-glow'); });
      setTimeout(() => keys.forEach(k => k.classList.remove('key-glow')), 800);
    }

    function appendXpPop(gained) {
      if (!gained) return;
      const s = document.createElement('span');
      s.className = 'xp-pop';
      s.textContent = `+${gained} XP`;
      qEl('feedback').appendChild(s);
    }

    // A one-line fact about this answer (or the unit) under the feedback.
    function factFor(q, u) {
      const own = [];
      if (q) {
        if (q.semis != null && INTERVAL_FACTS[q.semis]) own.push(...INTERVAL_FACTS[q.semis]);
        if (q.chordType && CHORD_FACTS[q.chordType]) own.push(...CHORD_FACTS[q.chordType]);
        if (q.scaleType && SCALE_FACTS[q.scaleType]) own.push(...SCALE_FACTS[q.scaleType]);
      }
      const fresh = (list) => list.filter(f => f !== state.lastFact);
      const a = fresh(own), b = fresh(UNIT_FACTS[u.id] || []);
      const pool = a.length && (Math.random() < 0.65 || !b.length) ? a : b;
      return pool.length ? pick(pool) : '';
    }

    function showFact(q, u) {
      const el = document.getElementById('learn-fact');
      const f = factFor(q, u);
      el.textContent = f;
      el.hidden = !f;
      state.lastFact = f;
    }

    // Short sounds on a quiet synth of their own, so they work before any
    // samples load and never change the round's instrument.
    let sfxSynth = null;
    function sfxVoice() {
      if (!sfxSynth) {
        sfxSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.005, decay: 0.12, sustain: 0.25, release: 0.35 },
        }).toDestination();
        sfxSynth.volume.value = -12;
      }
      return sfxSynth;
    }

    const STINGS = {
      combo: (n) => ['C5','D5','E5','G5','A5','C6'].slice(0, Math.min(6, 2 + n / COMBO_STEP))
        .map((note, i) => [i * 0.08, [note], 0.16]),
      life:  () => [[0, ['E4'], 0.16], [0.17, ['C4'], 0.32]],
      win:   () => [[0, ['C5'], 0.12], [0.12, ['E5'], 0.12], [0.24, ['G5'], 0.12],
                    [0.38, ['C5','E5','G5','C6'], 0.9]],
      lose:  () => [[0, ['G4'], 0.2], [0.22, ['F#4'], 0.2], [0.44, ['F4'], 0.2], [0.66, ['E4'], 0.6]],
    };

    function playSting(kind, n = 0) {
      if (!progress.settings.sfx) return;
      try {
        if (Tone.getContext().rawContext.state !== 'running') return;   // no tap yet: stay silent
        // A combo waits for the answer's own playback (e.g. the interval replay).
        const wait = kind === 'combo' ? Math.min(2.5, Math.max(0, measurePlayingUntil - performance.now()) / 1000) : 0;
        const t0 = Tone.now() + 0.05 + wait;
        STINGS[kind](n).forEach(([t, notes, dur]) => sfxVoice().triggerAttackRelease(notes, dur, t0 + t, 0.6));
      } catch (_) { /* sounds are a nicety */ }
    }

    function setSfx(on) {
      progress.settings.sfx = !!on;
      document.getElementById('learn-sfx').checked = !!on;
      saveProgress();
    }

    // Emoji confetti for a beaten boss or the day's first mix.
    function celebrate() {
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const box = document.createElement('div');
      box.className = 'confetti';
      box.setAttribute('aria-hidden', 'true');
      const bits = ['🎵','🎶','⭐','🎉','✨','🎹','🥁','🎸'];
      for (let i = 0; i < 28; i++) {
        const s = document.createElement('span');
        s.textContent = pick(bits);
        s.style.left = `${Math.random() * 100}vw`;
        s.style.animationDuration = `${1.6 + Math.random() * 1.4}s`;
        s.style.animationDelay = `${Math.random() * 0.4}s`;
        box.appendChild(s);
      }
      document.body.appendChild(box);
      setTimeout(() => box.remove(), 3600);
    }

    const STAR_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="#f59e0b" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.1 4.8 1.3 7-6.2-3.5-6.2 3.5 1.3-7L2 9.4l7-.9z"/></svg>';
    const FLAME_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>';

    function renderLearnStats() {
      const xp = progress.learn.xp;
      const xpEl = document.getElementById('learn-xp');
      xpEl.innerHTML = `${STAR_SVG}<span>${xp}</span>`;
      xpEl.setAttribute('aria-label', `${xp} XP`);
      const d = progress.daily;
      const live = streakAlive() && d.streak > 0;
      const chip = document.getElementById('learn-streak-chip');
      chip.innerHTML = `<span style="color:${live ? '#fb923c' : '#6b7280'};display:flex">${FLAME_SVG}</span><span>${live ? d.streak : 0}</span>`;
      chip.classList.toggle('is-cold', !live);
      chip.setAttribute('aria-label', live ? `${d.streak}-day streak` : 'No streak');

      // The daily mix lives at the top of the path sheet.
      const doneToday = d.last === localDate();
      const can = runSources({ kind: 'daily' }).length > 0;
      document.getElementById('learn-streak').textContent = live ? `${d.streak}-day streak`
        : (d.best ? `Streak lost (best ${d.best})` : 'No streak yet');
      document.getElementById('learn-daily-sub').textContent = !can
        ? 'Pass a unit’s Hear step to unlock the daily mix'
        : doneToday ? 'Today’s mix is done. Another one still earns XP.'
        : live ? 'Today’s mix keeps it going · 10 questions, no timer'
        : '10 questions, no timer. One a day builds a streak.';
      document.getElementById('learn-daily-card').classList.toggle('is-cold', !live);
      const btn = document.getElementById('learn-daily-btn');
      btn.disabled = !can;
      btn.classList.toggle('is-done', doneToday);
      btn.textContent = doneToday ? 'Again' : 'Start';
    }

    // ── Learn: daily streak dates ──

    // Local calendar date as YYYY-MM-DD, `offsetDays` from today.
    function localDate(offsetDays = 0) {
      const d = state.todayOverride ? new Date(`${state.todayOverride}T12:00:00`) : new Date();
      d.setDate(d.getDate() + offsetDays);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // A streak survives until a whole day passes without a finished mix.
    const streakAlive = () => progress.daily.last === localDate() || progress.daily.last === localDate(-1);

    // Count today's first finished mix; returns true if it was the first.
    function recordDailyDone() {
      const d = progress.daily;
      const today = localDate();
      if (d.last === today) return false;
      d.streak = d.last === localDate(-1) ? d.streak + 1 : 1;
      d.last = today;
      d.best = Math.max(d.best, d.streak);
      return true;
    }

    // ── Learn: boss and daily runs ──
    // A run is a fixed set of mixed questions. A boss draws from its own unit
    // (and a little from finished earlier ones), with three lives and a timer
    // per question; beating it finishes the unit. The daily mix draws from
    // every unit whose Hear step has passed, with no lives and no timer.

    const BOSS_QUESTIONS = 10;
    const BOSS_LIVES = 3;
    const DAILY_QUESTIONS = 10;
    const BOSS_BONUS_XP = 50;      // first win only
    const DAILY_BONUS_XP = 30;     // first mix of the day only
    // Answer time per question, on top of how long the prompt plays.
    const ANSWER_SECS = { choice: 10, keys: 18 };

    // Where a run's questions come from: [{ u, step, w }] with weights.
    function runSources(run) {
      if (run.kind === 'boss') {
        const u = LEARN_UNITS[run.unitIdx];
        const src = unitSteps(u).filter(s => s === 'hear' || s === 'play').map(step => ({ u, step, w: 3 }));
        const earlier = LEARN_UNITS.slice(0, run.unitIdx).filter(v => unitProgress(v.id).step === 'done');
        earlier.forEach(v => src.push({ u: v, step: 'hear', w: 2 / earlier.length }));
        return src;
      }
      const src = [];
      LEARN_UNITS.forEach(v => {
        const at = stepIndex(v, unitProgress(v.id).step);
        if (at > 0) src.push({ u: v, step: 'hear', w: 2 });
        if (v.play && at > 1) src.push({ u: v, step: 'play', w: 1 });
      });
      return src;
    }

    function startRun(kind) {
      abandonRun();
      state.learnRun = {
        kind, unitIdx: state.learnUnitIdx,
        len: kind === 'boss' ? BOSS_QUESTIONS : DAILY_QUESTIONS,
        idx: 0, correct: 0, xp: 0, results: [], resultsShown: false,
        lives: kind === 'boss' ? BOSS_LIVES : null,
        timed: kind === 'boss',
        begun: false, ended: false, won: false, bonus: 0,
      };
      renderLearn();   // shows the round and starts the first question
    }

    function abandonRun() {
      cancelAnimationFrame(runTimerRaf);
      state.learnRun = null;
      document.body.classList.remove('learn-focus');
      stopSinging();
    }

    function startRunRound() {
      const run = state.learnRun;
      if (!run || run.ended || state.mode !== 'learn') return;
      run.begun = true;
      const s = pickWeighted(runSources(run).map(x => [x, x.w]));
      const q = makeLearnQuestion(s.u, s.step, true);
      document.getElementById('learn-next-btn').textContent = 'Next';
      beginRound(q);
      if (run.timed) startRunTimer(q);
      renderRunBar();
      renderLearnMeter();
    }

    // How long a question's prompt takes to play, in seconds.
    function promptSeconds(q) {
      if (q.events) return eventsEnd(q.events);
      if (q.kind === 'interval') return eventsEnd(intervalPromptEvents(q, progress.settings.keyContext));
      if (q.kind === 'chord') return q.arpeggiate ? eventsEnd(chordThenArpEvents(q.midis)) : 1.2;
      if (q.kind === 'scale') return q.midis.length * 0.22 + 0.4;
      if (METERS[q.meter]) return eventsEnd(measurePromptEvents(q));
      return 1;
    }

    let runTimerRaf = 0;
    function startRunTimer(q) {
      const run = state.learnRun;
      run.limit = (promptSeconds(q) + (q.choices ? ANSWER_SECS.choice : ANSWER_SECS.keys)) * 1000;
      run.left = run.limit;
      run.tickAt = performance.now();
      cancelAnimationFrame(runTimerRaf);
      const tick = () => {
        if (state.learnRun !== run || run.ended || state.quizAnswered || state.quizQuestion !== q) return;
        const now = performance.now();
        // Capped so a backgrounded tab doesn't lose its time all at once.
        run.left -= Math.min(250, now - run.tickAt);
        run.tickAt = now;
        renderTimer();
        if (run.left <= 0) { timeUp(); return; }
        runTimerRaf = requestAnimationFrame(tick);
      };
      renderTimer();
      runTimerRaf = requestAnimationFrame(tick);
    }

    const TIMER_ARC = 289;   // the ring's circumference (r = 46)
    function renderTimer() {
      const run = state.learnRun;
      const ring = document.getElementById('learn-timer');
      const txt = document.getElementById('learn-timer-text');
      const on = !!run && run.timed && !run.ended;
      ring.toggleAttribute('hidden', !on);
      txt.hidden = !on;
      if (!on) return;
      const frac = run.limit ? Math.max(0, run.left) / run.limit : 1;
      const secs = Math.ceil(Math.max(0, run.left) / 1000);
      ring.querySelector('.learn-timer-arc').style.strokeDashoffset = String(TIMER_ARC * (1 - frac));
      ring.classList.toggle('low', frac < 0.25);
      ring.setAttribute('aria-label', `${secs} seconds left`);
      if (txt.textContent !== `${secs} s left`) txt.textContent = `${secs} s left`;
    }

    // Out of time: the round is answered with whatever was given (so, wrong).
    function timeUp() {
      const q = state.quizQuestion;
      if (!q || state.quizAnswered) return;
      state.timedOut = true;
      try {
        if (q.choices) answerChoice(null);
        else checkQuizAnswer();
      } finally {
        state.timedOut = false;
      }
    }

    const HEART_SVG = (full) => `<svg viewBox="0 0 24 24" aria-hidden="true" ${full
      ? 'fill="#ef4444"' : 'fill="none" stroke="#4b5563" stroke-width="2"'}><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5c3.4 0 5.4 3.6 4.1 6.8C19.5 16.4 12 21 12 21z"/></svg>`;

    // Focus mode: while a run is on (until its results card), the run's own
    // header and a segment per question replace the app chrome and steps.
    function renderRunBar() {
      const run = state.learnRun;
      const focus = !!run && !run.resultsShown && state.mode === 'learn';
      document.body.classList.toggle('learn-focus', focus);
      document.getElementById('learn-bar').hidden = focus;
      document.getElementById('learn-run-bar').hidden = !focus;
      renderTimer();
      if (!focus) return;
      const n = Math.min(run.len, run.idx + (state.quizAnswered ? 0 : 1));
      const boss = run.kind === 'boss';
      document.getElementById('learn-run-kicker').textContent =
        boss ? `Boss · question ${n} of ${run.len}` : `Question ${n} of ${run.len}`;
      document.getElementById('learn-run-count').textContent =
        boss ? UNIT_BOSSES[LEARN_UNITS[run.unitIdx].id] : 'Daily mix';
      const lives = document.getElementById('learn-lives');
      lives.innerHTML = run.lives == null ? ''
        : Array.from({ length: BOSS_LIVES }, (_, i) => HEART_SVG(i < run.lives)).join('');
      lives.setAttribute('aria-label', run.lives == null ? '' : `${Math.max(0, run.lives)} of ${BOSS_LIVES} lives left`);
      const strip = document.getElementById('learn-steps');
      strip.hidden = false;
      strip.className = 'learn-steps is-run';
      strip.style.setProperty('--n', run.len);
      strip.setAttribute('aria-label', `${run.correct} right of ${run.idx} answered`);
      strip.innerHTML = Array.from({ length: run.len }, (_, i) => {
        const r = run.results[i];
        return `<span class="run-seg${r === true ? ' hit' : r === false ? ' miss' : i === run.idx ? ' now' : ''}"></span>`;
      }).join('');
    }

    // ✕ in the run header: leave the boss (back to its card) or the mix.
    function quitRun() {
      const daily = state.learnDaily;
      abandonRun();
      if (daily) leaveDaily();
      else viewLearnStep('boss');
    }

    function recordRunResult(correct) {
      const run = state.learnRun;
      const q = state.quizQuestion;
      cancelAnimationFrame(runTimerRaf);
      run.idx++;
      run.results.push(!!correct);
      if (correct) run.correct++;
      const fb = qEl('feedback');
      if (state.timedOut) fb.textContent = '⏱ Time’s up! ' + fb.textContent;
      const gained = awardAnswer(correct);
      run.xp += gained;
      if (!correct && run.lives != null) {
        run.lives--;
        if (run.lives > 0) playSting('life');
      }
      if (run.lives === 0 || run.idx >= run.len) finishRun();
      document.getElementById('learn-next-btn').textContent = run.ended ? 'See results' : 'Next';
      appendXpPop(gained);
      showFact(q, unitById(q.unitId));
      showLearnResult();
      state.learnLastQ = { unitId: q.unitId, q };
      renderRunBar();
      saveProgress();
    }

    function finishRun() {
      const run = state.learnRun;
      run.ended = true;
      run.won = run.kind === 'daily' || run.lives > 0;
      if (run.kind === 'boss') {
        if (run.won) {
          const first = completeUnit(run.unitIdx);
          if (first) { run.bonus = BOSS_BONUS_XP; progress.learn.xp += run.bonus; }
          playSting('win');
          celebrate();
          if (!first) showBanner(`${UNIT_BOSSES[LEARN_UNITS[run.unitIdx].id]} beaten again! ⚔️`);
        } else {
          playSting('lose');
          showBanner('Out of lives — the boss wins this round');
        }
      } else {
        run.first = recordDailyDone();
        if (run.first) {
          run.bonus = DAILY_BONUS_XP;
          progress.learn.xp += run.bonus;
          playSting('win');
          celebrate();
          showBanner(`Daily mix done — 🔥 ${progress.daily.streak}-day streak!`);
        } else {
          showBanner('Mix done! Extra practice counts for XP.');
        }
      }
      saveProgress();
      renderLearnStats();
    }

    // Mark a unit done and move the frontier on. False if it was done already.
    function completeUnit(idx) {
      const up = unitProgress(LEARN_UNITS[idx].id);
      if (up.step === 'done') return false;
      up.step = 'done';
      // The next unfinished unit becomes the frontier (later units may
      // already be done, e.g. after new units were added to the path).
      const next = LEARN_UNITS.findIndex((u, i) => i > idx && unitProgress(u.id).step !== 'done');
      if (next >= 0 && progress.learn.unitIdx === idx) {
        progress.learn.unitIdx = next;
        showBanner(`Boss beaten! Unit ${next + 1} unlocked: ${LEARN_UNITS[next].title} 🎉`);
      } else if (LEARN_UNITS.every(u => unitProgress(u.id).step === 'done')) {
        showBanner('Path complete — great ears! 🎉');
      } else {
        showBanner('Boss beaten! 🎉');
      }
      saveProgress();
      return true;
    }

    // The card shown before a boss, and after any run.
    function renderLearnCard(u) {
      const card = document.getElementById('learn-card');
      const run = state.learnRun;
      card.className = 'learn-card';
      let title, text, buttons;
      if (run && run.ended) {
        const score = `${run.correct}/${run.len} right · +${run.xp + run.bonus} XP` +
          (run.bonus ? ` (incl. +${run.bonus} bonus)` : '');
        if (run.kind === 'boss' && run.won) {
          card.classList.add('is-win');
          const next = progress.learn.unitIdx;
          title = `🏆 ${UNIT_BOSSES[u.id]} is beaten!`;
          text = `${score}.` + (next > run.unitIdx ? ` Next up: ${LEARN_UNITS[next].title}.` : '');
          buttons = [['next-unit', next > run.unitIdx ? `Unit ${next + 1}: ${LEARN_UNITS[next].title} →` : 'Back to the path →', ''],
                     ['boss', 'Rematch ⚔️', 'secondary']];
        } else if (run.kind === 'boss') {
          card.classList.add('is-lose');
          title = `💥 ${UNIT_BOSSES[u.id]} wins this time`;
          text = `${score}. Three slips and the run ends. Practise a little, then come back swinging.`;
          buttons = [['boss', 'Try again ⚔️', ''], ['hear', 'Practise this unit', 'secondary']];
        } else {
          card.classList.add('is-win');
          title = run.first ? `🔥 Daily mix done — ${progress.daily.streak}-day streak` : '🔁 Mix done';
          text = `${score}. ${run.first ? 'Come back tomorrow to keep the streak alive.' : 'Today’s streak was already counted, but the XP is yours.'}`;
          buttons = [['leave-daily', 'Back to the path', ''], ['daily', 'Another mix', 'secondary']];
        }
      } else {
        const beaten = unitProgress(u.id).step === 'done';
        title = `⚔️ Boss: ${UNIT_BOSSES[u.id]}`;
        text = (beaten ? 'You’ve beaten this one already. A rematch is good practice and still earns XP. ' : '') +
          `${BOSS_QUESTIONS} mixed questions from this unit` +
          (state.learnUnitIdx > 0 ? ', plus a few from earlier ones' : '') +
          `. You have ${BOSS_LIVES} lives and a timer on each question. ` +
          `<span class="dim">Beat it to ${beaten ? 'prove it was no fluke' : 'finish the unit'}.</span>`;
        buttons = [['boss', beaten ? 'Rematch ⚔️' : 'Fight ⚔️', '']];
      }
      card.innerHTML = `<div class="learn-card-title"></div><div class="learn-card-text"></div><div class="btn-row"></div>`;
      card.querySelector('.learn-card-title').textContent = title;
      card.querySelector('.learn-card-text').innerHTML = text;
      const row = card.querySelector('.btn-row');
      buttons.forEach(([action, label, cls]) => {
        const b = document.createElement('button');
        b.className = `play-btn ${cls}`.trim();
        b.dataset.action = action;
        b.textContent = label;
        b.addEventListener('click', () => learnCardAction(action));
        row.appendChild(b);
      });
    }

    function learnCardAction(action) {
      if (action === 'boss') startRun('boss');
      else if (action === 'daily') startRun('daily');
      else if (action === 'leave-daily') leaveDaily();
      else if (action === 'next-unit') { abandonRun(); viewLearnUnit(progress.learn.unitIdx); }
      else if (action === 'hear') { abandonRun(); viewLearnStep('hear'); }
    }

    function enterDaily() {
      if (!runSources({ kind: 'daily' }).length) return false;
      abandonRun();
      state.learnDaily = true;
      startRun('daily');
      return true;
    }

    function leaveDaily() {
      abandonRun();
      state.learnDaily = false;
      renderLearn();
    }

    // ── Learn: singing into the mic ──
    // Pitch detection is the Tuner app's autocorrelation. A note counts once
    // it is held steadily: the right note class for 0.4 s, a wrong one for 1 s
    // (so sliding into the note isn't marked wrong). Listening waits for the
    // prompt to finish, so the app doesn't hear itself.

    const SING_RIGHT_MS = 400;
    const SING_WRONG_MS = 1000;
    const SING_IN_TUNE_CENTS = 40;
    const sing = { stream: null, ctx: null, analyser: null, buf: null, corr: null, raf: 0, q: null,
                   listenFrom: 0, stableMidi: null, stableSince: 0 };

    function detectPitch(buf, sampleRate) {
      let rms = 0;
      for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      if (Math.sqrt(rms / buf.length) < 0.01) return null;
      const minLag = Math.floor(sampleRate / 1500);
      const maxLag = Math.ceil(sampleRate / 70);
      if (!sing.corr || sing.corr.length < maxLag) sing.corr = new Float32Array(maxLag);
      const corr = sing.corr;
      for (let lag = minLag; lag < maxLag; lag++) {
        let c = 0;
        const len = buf.length - lag;
        for (let i = 0; i < len; i++) c += buf[i] * buf[i + lag];
        corr[lag] = c;
      }
      let firstMin = minLag;
      for (let i = minLag + 1; i < maxLag - 1; i++) {
        if (corr[i] <= corr[i - 1] && corr[i] <= corr[i + 1]) { firstMin = i; break; }
      }
      let bestLag = -1, bestCorr = -Infinity;
      for (let i = firstMin; i < maxLag; i++) {
        if (corr[i] > bestCorr) { bestCorr = corr[i]; bestLag = i; }
      }
      if (bestLag < 0 || bestCorr <= 0) return null;
      const y1 = corr[bestLag > 0 ? bestLag - 1 : bestLag];
      const y2 = corr[bestLag];
      const y3 = corr[bestLag < maxLag - 1 ? bestLag + 1 : bestLag];
      const d = y1 - 2 * y2 + y3;
      return sampleRate / (d !== 0 ? bestLag + 0.5 * (y1 - y3) / d : bestLag);
    }

    async function ensureMic() {
      if (sing.analyser) return true;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
      try {
        sing.stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false },
        });
        sing.ctx = new (window.AudioContext || window.webkitAudioContext)();
        try { await Promise.race([sing.ctx.resume(), new Promise(r => setTimeout(r, 750))]); } catch (_) {}
        const src = sing.ctx.createMediaStreamSource(sing.stream);
        sing.analyser = sing.ctx.createAnalyser();
        sing.analyser.fftSize = 2048;
        src.connect(sing.analyser);
        sing.buf = new Float32Array(sing.analyser.fftSize);
        return true;
      } catch (_) {
        releaseMic();
        return false;
      }
    }

    // Close the mic entirely (sing mode off, or the page backgrounded).
    function releaseMic() {
      if (sing.stream) sing.stream.getTracks().forEach(t => t.stop());
      if (sing.ctx) { try { sing.ctx.close(); } catch (_) {} }
      sing.stream = sing.ctx = sing.analyser = null;
    }

    function setSingUi(note, level, status, match = false) {
      document.getElementById('learn-sing-note').textContent = note;
      document.getElementById('learn-sing-level').style.width = `${Math.round(Math.min(1, level) * 100)}%`;
      document.getElementById('learn-sing-status').textContent = status;
      document.getElementById('learn-sing').classList.toggle('is-match', match);
    }

    async function startSinging(q) {
      cancelAnimationFrame(sing.raf);
      sing.q = q;
      sing.stableMidi = null;
      sing.listenFrom = performance.now() + 1500;
      setSingUi('–', 0, 'Hear the lit note, then sing');
      const ok = await ensureMic();
      if (state.quizQuestion !== q || state.quizAnswered) return;
      if (!ok) {
        setSingUi('–', 0, 'Can’t use the microphone — tap the key instead');
        return;
      }
      sing.raf = requestAnimationFrame(singTick);
    }

    function stopSinging() {
      cancelAnimationFrame(sing.raf);
      sing.q = null;
    }

    function singTick() {
      const q = sing.q;
      if (!q || state.quizQuestion !== q || state.quizAnswered || !sing.analyser) return;
      sing.analyser.getFloatTimeDomainData(sing.buf);
      let rms = 0;
      for (let i = 0; i < sing.buf.length; i++) rms += sing.buf[i] * sing.buf[i];
      const level = Math.sqrt(rms / sing.buf.length) * 8;
      const now = performance.now();
      const listening = now >= sing.listenFrom && now >= measurePlayingUntil + 300;
      const f = listening ? detectPitch(sing.buf, sing.ctx.sampleRate) : null;
      if (f) {
        const mf = 69 + 12 * Math.log2(f / 440);
        const m = Math.round(mf);
        const cents = Math.round((mf - m) * 100);
        const match = m % 12 === q.targetMidi % 12;
        const steady = Math.abs(cents) <= SING_IN_TUNE_CENTS;
        setSingUi(NOTE_NAMES[((m % 12) + 12) % 12], level,
          `${cents >= 0 ? '+' : ''}${cents}¢${match ? (steady ? ' · hold it…' : ' · nearly') : ''}`, match && steady);
        if (m === sing.stableMidi && (steady || !match)) {
          const held = now - sing.stableSince;
          if ((match && held >= SING_RIGHT_MS) || (!match && held >= SING_WRONG_MS)) { judgeSung(m); return; }
        } else if (m !== sing.stableMidi) {
          sing.stableMidi = m;
          sing.stableSince = now;
        }
      } else {
        sing.stableMidi = null;
        setSingUi('–', listening ? level : 0, listening ? 'Listening…' : 'Hear the lit note, then sing');
      }
      sing.raf = requestAnimationFrame(singTick);
    }

    // Judge a sung note (a MIDI number) against the current sing round.
    function judgeSung(midi) {
      const q = state.quizQuestion;
      if (!q || q.kind !== 'sing' || state.quizAnswered) return false;
      stopSinging();
      const correct = ((midi % 12) + 12) % 12 === q.targetMidi % 12;
      revealIntervalKeys(q);
      const wrongKey = !correct && document.querySelector(`.key[data-midi="${midi}"]`);
      if (wrongKey) wrongKey.classList.add('quiz-wrong');
      measurePlayingUntil = 0;
      playIntervalPrompt(q);
      const fb = qEl('feedback');
      const sung = NOTE_NAMES[((midi % 12) + 12) % 12];
      fb.textContent = correct ? `✓ Correct! You sang ${sung}.` : `✗ You sang ${sung}. It was ${q.answerName}`;
      fb.className = 'quiz-feedback ' + (correct ? 'correct' : 'wrong');
      qEl('label').textContent = q.answerName;
      qEl('options').textContent = '';
      document.getElementById('learn-sing').classList.toggle('is-match', correct);
      recordQuizResult(correct);
      return true;
    }

    // The 🎤 toggle: asks for the mic straight away (it is a tap), and turns
    // itself back off if the mic can't be used.
    async function setSing(on, askMic = true) {
      progress.settings.sing = !!on;
      document.getElementById('learn-sing-toggle').checked = !!on;
      saveProgress();
      if (on && askMic && !(await ensureMic())) {
        progress.settings.sing = false;
        document.getElementById('learn-sing-toggle').checked = false;
        saveProgress();
        showBanner('Microphone blocked — singing is off');
      }
      if (!progress.settings.sing) releaseMic();
      if (state.mode === 'learn' && !state.learnRun && state.learnStep === 'play') startLearnRound();
    }

    function recordLearnResult(correct) {
      stopSinging();
      if (state.learnRun) { recordRunResult(correct); return; }
      const u = LEARN_UNITS[state.learnUnitIdx];
      const q = state.quizQuestion;
      if (q && q.hinted) {
        state.learnLastQ = { unitId: u.id, q };
        qEl('feedback').textContent += '  (Hinted: practice only, not counted.)';
        showFact(q, u);
        showLearnResult();
        return;
      }
      const step = state.learnStep;
      const up = unitProgress(u.id);
      const stats = up[step];
      stats.total++;
      if (correct) stats.correct++;
      stats.recent.push(correct ? 1 : 0);
      if (stats.recent.length > LEARN_PASS_WINDOW) stats.recent.shift();
      state.learnLastQ = { unitId: u.id, q };
      const gained = awardAnswer(correct);

      // Only the unit's frontier step can advance; replaying an earlier
      // step (or a finished unit) is practice.
      if (up.step === step && stepPassed(stats)) {
        const steps = unitSteps(u);
        up.step = steps[steps.indexOf(step) + 1];
        state.learnJustPassed = true;
        const fb = qEl('feedback');
        fb.textContent += up.step === 'play' ? '  Your ear has it — now play it!' : '  Step complete!';
        document.getElementById('learn-next-btn').textContent = 'Continue';
        showBanner(`${LEARN_STEP_LABELS[step]} ✓ — next: ${LEARN_STEP_LABELS[up.step]}`);
      }
      appendXpPop(gained);
      showFact(q, u);
      showLearnResult();
      saveProgress();
      renderLearnMeter();
      renderLearnSteps();
    }

    // Next / Continue: move on to the next step if this one just passed,
    // otherwise another round of the same step. In a run: the next question,
    // or the results once it is over.
    function learnNext() {
      const run = state.learnRun;
      if (run) {
        if (run.ended) { run.resultsShown = true; renderLearn(); }
        else startRunRound();
        return;
      }
      if (state.learnJustPassed) {
        state.learnJustPassed = false;
        state.learnStep = defaultLearnStep(LEARN_UNITS[state.learnUnitIdx]);
        renderLearn();
      } else {
        startLearnRound();
      }
    }

    // "Got it" on the why step: on to the boss (a finished unit goes back to
    // the path's frontier instead).
    function learnGotIt() {
      if (state.learnStep !== 'why' || state.learnDaily) return false;
      const u = LEARN_UNITS[state.learnUnitIdx];
      const up = unitProgress(u.id);
      if (up.step === 'done') {
        viewLearnUnit(progress.learn.unitIdx);
        return true;
      }
      if (up.step === 'why') {
        up.step = 'boss';
        saveProgress();
        showBanner(`Boss unlocked: ${UNIT_BOSSES[u.id]} ⚔️`);
      }
      state.learnStep = 'boss';
      renderLearn();
      return true;
    }

    function viewLearnUnit(idx) {
      if (idx < 0 || idx >= LEARN_UNITS.length || unitLocked(idx)) return;
      abandonRun();
      state.learnDaily = false;
      state.learnUnitIdx = idx;
      state.learnStep = defaultLearnStep(LEARN_UNITS[idx]);
      state.learnJustPassed = false;
      renderLearn();
    }

    function viewLearnStep(step) {
      const u = LEARN_UNITS[state.learnUnitIdx];
      if (stepIndex(u, step) > stepIndex(u, unitProgress(u.id).step)) return;  // no skipping ahead
      clearRoundVideo();
      abandonRun();
      state.learnDaily = false;
      state.learnStep = step;
      state.learnJustPassed = false;
      renderLearn();
    }

    function renderLearn() {
      const u = LEARN_UNITS[state.learnUnitIdx];
      // Left the tab before pressing Continue: resume at the step just unlocked.
      if (state.learnJustPassed) {
        state.learnJustPassed = false;
        state.learnStep = defaultLearnStep(u);
      }
      renderLearnStats();
      renderLearnUnits();
      const run = state.learnRun;
      const runLive = !!run && !run.ended;
      const inRound = runLive || (!state.learnDaily && (state.learnStep === 'hear' || state.learnStep === 'play'));
      const onCard = !inRound && (state.learnDaily || state.learnStep === 'boss');

      document.getElementById('learn-progress-row').hidden = runLive || !inRound;
      const kicker = document.getElementById('learn-kicker');
      const goal = document.getElementById('learn-goal');
      if (state.learnDaily) {
        kicker.textContent = 'Review';
        document.getElementById('learn-title').textContent = 'Daily mix';
        goal.textContent = 'Ten mixed questions from the units you have started. No timer, no lives.';
        goal.hidden = runLive;
        document.getElementById('learn-steps').hidden = !runLive;
      } else {
        kicker.textContent = `Unit ${state.learnUnitIdx + 1} of ${LEARN_UNITS.length}`;
        document.getElementById('learn-title').textContent = u.title;
        // The goal shows until the step has its first answer, then steps aside.
        const st = inRound ? unitProgress(u.id)[state.learnStep] : null;
        goal.textContent = u.goal;
        goal.hidden = runLive || !(st && st.total === 0);
        document.getElementById('learn-steps').hidden = false;
        if (!runLive) renderLearnSteps();
      }
      renderRunBar();

      document.getElementById('learn-round').hidden = !inRound;
      document.getElementById('learn-card').hidden = !onCard;
      document.getElementById('learn-why').hidden = inRound || onCard;
      if (state.mode !== 'learn') return;
      if (runLive) {
        if (!run.begun) startRunRound();
      } else if (inRound) {
        startLearnRound();
      } else {
        stopSinging();
        state.quizQuestion = null;
        state.quizAnswered = false;
        clearHighlight();
        if (onCard) renderLearnCard(u);
        else renderLearnWhy(u);
      }
    }

    const UNIT_ICONS = {
      done:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>',
      current: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.6" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="#f59e0b" stroke="none"/></svg>',
      open:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>',
      locked:  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    };

    // The path sheet's unit list: status, name, and where each one is up to.
    function renderLearnUnits() {
      const list = document.getElementById('learn-units');
      list.innerHTML = '';
      LEARN_UNITS.forEach((u, i) => {
        const step = unitProgress(u.id).step;
        const done = step === 'done';
        const locked = unitLocked(i);
        const current = i === progress.learn.unitIdx && !done;
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.className = 'learn-unit' +
          (done ? ' is-done' : '') +
          (locked ? ' is-locked' : '') +
          (current ? ' is-current' : '') +
          (i === state.learnUnitIdx && !state.learnDaily ? ' is-viewing' : '');
        b.dataset.unit = u.id;
        b.disabled = locked;
        const status = done ? 'Done' : locked ? 'Locked' : current ? 'In progress' : 'Open';
        b.setAttribute('aria-label', `${i + 1}. ${u.title}: ${status}`);
        const meta = done ? 'Boss beaten' : locked ? '' : step === 'boss' ? 'Boss ready'
          : `${LEARN_STEP_LABELS[step]}`;
        b.innerHTML = UNIT_ICONS[done ? 'done' : locked ? 'locked' : current ? 'current' : 'open'] +
          `<span class="learn-unit-name"></span><span class="learn-unit-meta"></span>`;
        b.querySelector('.learn-unit-name').textContent = `${i + 1}. ${u.title}`;
        b.querySelector('.learn-unit-meta').textContent = meta;
        b.addEventListener('click', () => { closeSheets(); viewLearnUnit(i); });
        li.appendChild(b);
        list.appendChild(li);
      });
    }

    // How far through a hear/play step: right answers in the window, out of
    // the LEARN_PASS_MIN needed.
    function stepFill(u, s) {
      const st = unitProgress(u.id)[s];
      if (!st) return 0;
      return Math.min(1, st.recent.slice(-LEARN_PASS_WINDOW).filter(Boolean).length / LEARN_PASS_MIN);
    }

    // The steps as one segmented bar; done steps fill green, the current one
    // fills amber as right answers come in.
    function renderLearnSteps() {
      const u = LEARN_UNITS[state.learnUnitIdx];
      const frontier = stepIndex(u, unitProgress(u.id).step);
      const box = document.getElementById('learn-steps');
      box.className = 'learn-steps';
      box.innerHTML = '';
      const steps = unitSteps(u);
      box.style.setProperty('--n', steps.length);
      steps.forEach((s, i) => {
        const b = document.createElement('button');
        b.className = 'learn-step' +
          (i < frontier ? ' is-done' : '') +
          (s === state.learnStep ? ' is-viewing' : '');
        b.dataset.step = s;
        b.disabled = i > frontier;
        const fill = i < frontier ? 1 : i === frontier && (s === 'hear' || s === 'play') ? stepFill(u, s) : 0;
        b.innerHTML = `<span class="learn-step-bar"><i style="width:${Math.round(fill * 100)}%"></i></span><span></span>`;
        b.lastChild.textContent = LEARN_STEP_LABELS[s] + (i < frontier ? ' ✓' : '');
        b.setAttribute('aria-label', `${LEARN_STEP_LABELS[s]}${i < frontier ? ', done' : i > frontier ? ', locked' : ''}`);
        b.addEventListener('click', () => viewLearnStep(s));
        box.appendChild(b);
      });
    }

    // One line under the steps: where this step stands.
    function renderLearnMeter() {
      const el = document.getElementById('learn-meter');
      const step = state.learnStep;
      if (state.learnRun || (step !== 'hear' && step !== 'play')) { el.innerHTML = ''; return; }
      const u = LEARN_UNITS[state.learnUnitIdx];
      const stats = unitProgress(u.id)[step];
      const hits = stats.recent.slice(-LEARN_PASS_WINDOW).filter(Boolean).length;
      const label = `<b>${LEARN_STEP_LABELS[step]}</b>`;
      if (stepIndex(u, unitProgress(u.id).step) > stepIndex(u, step)) {
        el.innerHTML = `${label} · practice`;
      } else if (hits >= LEARN_PASS_MIN && stats.total < LEARN_PASS_WINDOW) {
        el.innerHTML = `${label} · ${LEARN_PASS_WINDOW - stats.total} more to go`;
      } else {
        el.innerHTML = `${label} · ${Math.min(hits, LEARN_PASS_MIN)} of ${LEARN_PASS_MIN} right to pass`;
      }
      el.title = `Get ${LEARN_PASS_MIN} of your last ${LEARN_PASS_WINDOW} right to move on`;
    }

    // ── Learn: sheets ──

    let sheetReturnFocus = null;
    function openSheet(id) {
      closeSheets();
      if (id === 'learn-path-sheet') renderLearnUnits();
      sheetReturnFocus = document.activeElement;
      document.getElementById('learn-sheet-backdrop').hidden = false;
      const sheet = document.getElementById(id);
      sheet.hidden = false;
      const first = sheet.querySelector('[data-close-sheet]');
      if (first) first.focus();
    }

    function closeSheets() {
      const open = document.querySelector('.sheet:not([hidden])');
      document.querySelectorAll('.sheet').forEach(sh => { sh.hidden = true; });
      document.getElementById('learn-sheet-backdrop').hidden = true;
      if (open && sheetReturnFocus && document.contains(sheetReturnFocus)) sheetReturnFocus.focus();
      sheetReturnFocus = null;
    }

    // Songs whose chords are all among the chord types learned so far.
    function learnSongs(unitIdx) {
      const known = new Set();
      LEARN_UNITS.slice(0, unitIdx + 1).forEach(u => {
        if (u.hear.type === 'chord') u.hear.types.forEach(t => known.add(t));
      });
      return Object.keys(SONGS).filter(name => SONGS[name].every(c => known.has(c.type)));
    }

    function renderLearnWhy(u) {
      document.getElementById('learn-why-text').innerHTML = u.why.map(p => `<p>${p}</p>`).join('');
      document.getElementById('learn-show-me').hidden = !u.show;
      document.getElementById('learn-got-it').textContent =
        unitProgress(u.id).step === 'done' ? 'Got it ✓' : `Got it — face the boss ⚔️`;

      const songsBox = document.getElementById('learn-songs');
      songsBox.innerHTML = '';
      songsBox.hidden = !u.songs;
      if (!u.songs) return;
      const title = document.createElement('div');
      title.className = 'learn-songs-title';
      title.textContent = 'Songs you can play now';
      const chips = document.createElement('div');
      chips.className = 'song-chord-chips';
      learnSongs(state.learnUnitIdx).forEach(name => {
        const b = document.createElement('button');
        b.className = 'song-chord-chip';
        b.dataset.song = name;
        b.textContent = name;
        b.addEventListener('click', () => openSong(name));
        chips.appendChild(b);
      });
      songsBox.append(title, chips);
    }

    // Jump to the Chords tab with a song picked and its first chord shown.
    function openSong(name) {
      state.songName = name;
      state.activeSongChord = -1;
      document.getElementById('song-select').value = name;
      switchMode('chords');
      renderSongChordChips();
      const first = document.querySelector('#song-chord-chips .song-chord-chip');
      if (first) first.click();
    }

    // "Show me on the keyboard": open the explore tab for this unit, set to
    // what was just practised where possible.
    function learnShowMe() {
      const u = LEARN_UNITS[state.learnUnitIdx];
      const s = u.show;
      if (!s) return;
      const last = state.learnLastQ && state.learnLastQ.unitId === u.id ? state.learnLastQ.q : null;
      measurePlayingUntil = 0;

      if (s.mode === 'intervals') {
        const semis = last && last.semis ? last.semis : s.semis;
        const low = last && last.low != null ? last.low : MIDDLE_C;
        switchMode('intervals');
        state.ivNotes = [low, low + semis];
        updateHighlight();
        updateIntervalDisplay();
        scrollToMidi(low + Math.round(semis / 2));
        playIntervalPrompt({ mode: 'ascending', midis: state.ivNotes });
        return;
      }

      const isChord = s.mode === 'chords';
      const sameKind = last && last.kind === (isChord ? 'chord' : 'scale');
      const root = sameKind ? last.rootPc : 0;
      const type = sameKind && s.fromLast ? (isChord ? last.chordType : last.scaleType) : s.type;
      if (isChord) {
        state.chordRoot = root;
        state.chordType = type;
        setPickerValue('chord-root-picker', root);
        document.getElementById('chord-type-select').value = type;
        switchMode('chords');
        updateChordDisplay();
        playEvents(chordThenArpEvents(getChordMidis(root, CHORDS[type].intervals)));
      } else {
        state.scaleRoot = root;
        state.scaleType = type;
        setPickerValue('scale-root-picker', root);
        document.getElementById('scale-type-select').value = type;
        switchMode('scales');
        updateScaleDisplay();
        playScaleSequence(getScaleMidis(root, [...SCALES[type].intervals, 12]));
      }
      scrollToRoot(root);
    }

    // Wipe saved progress (Learn path and free-play quiz level/streak).
    function resetProgress() {
      const settings = progress.settings;   // a preference, not progress: keep it
      abandonRun();
      state.learnDaily = false;
      state.learnCombo = 0;
      renderCombo(false);
      try { localStorage.removeItem(PROGRESS_KEY); } catch (_) {}
      progress = defaultProgress();
      progress.settings = settings;
      if (JSON.stringify(settings) !== JSON.stringify(defaultProgress().settings)) saveProgress();
      applyProgress();
      state.quizScore = { correct: 0, total: 0 };
      document.getElementById('quiz-score').textContent = '— / —';
      updateQuizLevelBtn();
      renderLearn();
    }

    // Debug hook (?debug=1): answer the current round right or wrong through
    // the same paths a tap would take, then press Next.
    function debugAnswer(correct) {
      if (!answerNow(correct)) return false;
      setTimeout(() => {
        if (!state.quizAnswered) return;
        if (state.mode === 'learn') learnNext();
        else if (state.mode === 'quiz') startQuizRound();
      }, 0);
      return true;
    }

    // Answer the current round right or wrong, without moving on.
    function answerNow(correct) {
      const q = state.quizQuestion;
      if (!q || state.quizAnswered) return false;
      if (q.kind === 'sing') {
        judgeSung(correct ? q.targetMidi : q.targetMidi + 1);
      } else if (q.choices) {
        const wrong = q.choices.find(c => !choiceRight(q, c.id));
        answerChoice(correct || !wrong ? q.answer : wrong.id);
      } else {
        const need = [...(q.needPcs || q.answerPcs)];
        // A key for `pc` in the middle octave that isn't an already-given key.
        const midiFor = (pc) => {
          const m = MIDDLE_C + pc;
          return q.givenMidis && q.givenMidis.includes(m) ? m + 12 : m;
        };
        if (correct && q.exactMidi != null) {
          registerQuizKey(q.exactMidi);
        } else if (correct) {
          need.forEach(pc => registerQuizKey(midiFor(pc)));
        } else {
          let bad = 0;
          while (q.answerPcs.has(bad)) bad++;
          [bad, ...need.slice(1)].forEach(pc => registerQuizKey(midiFor(pc)));
        }
      }
      return true;
    }

    // Debug: play a whole boss run with right answers (or `misses` wrong ones
    // first), ending on its results card. False unless a boss step is open.
    function debugPlayBoss(misses = 0) {
      if (state.learnDaily || state.learnStep !== 'boss') return false;
      startRun('boss');
      let k = 0;
      while (state.learnRun && !state.learnRun.ended) {
        answerNow(k++ >= misses);
        if (!state.learnRun.ended) startRunRound();
      }
      learnNext();
      return true;
    }

    // ── Mode Switching ────────────────────────────────────────────────────────

    function switchMode(mode) {
      // Leaving Learn ends a boss or daily run (they are short) and the mic.
      if (mode !== 'learn') {
        clearRoundVideo();
        abandonRun();
        state.learnDaily = false;
        releaseMic();
        closeSheets();
      }
      state.mode = mode;
      state.ivNotes = [];

      document.querySelectorAll('.tab').forEach(t => {
        const active = t.dataset.mode === mode;
        t.classList.toggle('active', active);
        t.setAttribute('aria-selected', active);
      });
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`panel-${mode}`).classList.add('active');

      // Explore tabs play the picker's instrument, not the last round's.
      if (mode !== 'learn' && mode !== 'quiz') useInstrument(chosenInstrument());
      updateHighlight();
      if (mode === 'intervals') updateIntervalDisplay();
      if (mode === 'quiz') { clearHighlight(); startQuizRound(); }
      if (mode === 'learn') renderLearn();
    }

    // ── Init ──────────────────────────────────────────────────────────────────

    function init() {
      applyProgress();
      buildKeyboard();
      setupKeyboardInteraction();

      // Scale picker + select
      buildPicker('scale-root-picker', 'scaleRoot', () => {
        updateHighlight();
        updateScaleDisplay();
        scrollToRoot(state.scaleRoot);
      });
      buildSelect('scale-type-select', SCALES, (val) => {
        state.scaleType = val;
        updateHighlight();
        updateScaleDisplay();
      });

      // Chord picker + select
      buildPicker('chord-root-picker', 'chordRoot', () => {
        updateHighlight();
        updateChordDisplay();
        scrollToRoot(state.chordRoot);
        playChord(getChordMidis(state.chordRoot, CHORDS[state.chordType].intervals));
      });
      buildSelect('chord-type-select', CHORDS, (val) => {
        state.chordType = val;
        updateHighlight();
        updateChordDisplay();
      });
      buildSongSelect();

      // Play buttons
      document.getElementById('scale-play-btn').addEventListener('click', () => {
        const def = SCALES[state.scaleType];
        playScaleSequence(getScaleMidis(state.scaleRoot, def.intervals));
      });
      document.getElementById('chord-play-btn').addEventListener('click', () => {
        const def = CHORDS[state.chordType];
        playChord(getChordMidis(state.chordRoot, def.intervals));
      });
      document.getElementById('chord-arp-btn').addEventListener('click', () => {
        const def = CHORDS[state.chordType];
        playArpeggiated(getChordMidis(state.chordRoot, def.intervals));
      });

      // Mode tabs
      document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => switchMode(t.dataset.mode));
      });

      // Quiz type toggle
      document.querySelectorAll('.quiz-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.quiz-type-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.quizType = btn.dataset.type;
          state.quizScore = { correct: 0, total: 0 };
          document.getElementById('quiz-score').textContent = '— / —';
          if (state.mode === 'quiz') startQuizRound();
        });
      });

      // Quiz difficulty selector — cycles Beginner → Intermediate → Advanced
      updateQuizLevelBtn();
      document.getElementById('quiz-level-btn').addEventListener('click', () => {
        setQuizLevel(state.quizLevel >= 3 ? 1 : state.quizLevel + 1);
      });

      // Quiz play / next buttons
      document.getElementById('quiz-play-btn').addEventListener('click', () => {
        if (!state.quizQuestion) { startQuizRound(); return; }
        playQuizPrompt();
      });
      document.getElementById('quiz-next-btn').addEventListener('click', startQuizRound);

      // Learn path controls
      document.getElementById('learn-play-btn').addEventListener('click', () => {
        if (!state.quizQuestion) { startLearnRound(); return; }
        playQuizPrompt();
      });
      document.getElementById('learn-next-btn').addEventListener('click', learnNext);
      document.getElementById('learn-hint-btn').addEventListener('click', learnHint);
      document.querySelectorAll('.keyctx-toggle').forEach(cb => {
        cb.checked = progress.settings.keyContext;
        cb.addEventListener('change', () => setKeyContext(cb.checked));
      });
      document.getElementById('learn-got-it').addEventListener('click', learnGotIt);
      document.getElementById('learn-show-me').addEventListener('click', learnShowMe);
      document.getElementById('learn-reset').addEventListener('click', () => {
        if (confirm('Reset all progress? This clears the Learn path and your Quiz level.')) {
          closeSheets();
          resetProgress();
        }
      });
      document.getElementById('learn-unit-btn').addEventListener('click', () => openSheet('learn-path-sheet'));
      document.getElementById('learn-settings-btn').addEventListener('click', () => openSheet('learn-settings-sheet'));
      document.getElementById('learn-sheet-backdrop').addEventListener('click', closeSheets);
      document.querySelectorAll('[data-close-sheet]').forEach(b => b.addEventListener('click', closeSheets));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.querySelector('.sheet:not([hidden])')) closeSheets();
      });
      document.getElementById('learn-run-quit').addEventListener('click', quitRun);

      // Instrument picker (grouped by family) and the Learn "Mix instruments" toggle
      const instrumentSel = document.getElementById('instrument-select');
      const groups = [...new Set(INSTRUMENTS.map(i => i.group))];
      instrumentSel.innerHTML = `<option value="${RANDOM_INSTRUMENT}">🎲 Random</option>` +
        groups.map(g => `<optgroup label="${g}">` + INSTRUMENTS.filter(i => i.group === g)
          .map(i => `<option value="${i.id}">${i.label}</option>`).join('') + '</optgroup>').join('');
      instrumentSel.value = progress.settings.instrument;
      useInstrument(chosenInstrument());
      if (progress.settings.instrument === RANDOM_INSTRUMENT) preloadInstruments();
      instrumentSel.addEventListener('change', () => chooseInstrument(instrumentSel.value));
      const mixCb = document.getElementById('learn-mix');
      mixCb.checked = progress.settings.learnMix;
      mixCb.addEventListener('change', () => setLearnMix(mixCb.checked));

      // Learn game layer: daily mix, sound effects, singing
      document.getElementById('learn-daily-btn').addEventListener('click', () => {
        closeSheets();
        ensureAudioStarted();   // this tap unlocks audio; the mix needn't wait for it
        enterDaily();
      });
      const sfxCb = document.getElementById('learn-sfx');
      sfxCb.checked = progress.settings.sfx;
      sfxCb.addEventListener('change', () => setSfx(sfxCb.checked));
      const singCb = document.getElementById('learn-sing-toggle');
      singCb.checked = progress.settings.sing;
      singCb.addEventListener('change', () => setSing(singCb.checked));
      document.addEventListener('visibilitychange', () => {
        // Don't hold the mic open in the background; pick it up again on return.
        if (document.visibilityState === 'hidden') { stopSinging(); releaseMic(); return; }
        const q = state.quizQuestion;
        if (state.mode === 'learn' && q && q.kind === 'sing' && !state.quizAnswered) startSinging(q);
      });

      // Initial display — the app opens on the Learn path
      updateScaleDisplay();
      updateChordDisplay();
      switchMode('learn');
      // Centre the keyboard on the current round's keys, or middle C (C4).
      requestAnimationFrame(() => {
        const q = state.quizQuestion;
        scrollToMidi(q && q.focusMidi != null ? q.focusMidi : MIDDLE_C, false);
      });

      // Test hooks, only with ?debug=1
      if (new URLSearchParams(location.search).get('debug') === '1') {
        window.__musicTheory = {
          get state()    { return state; },
          get progress() { return loadProgress(); },
          units: LEARN_UNITS.map(u => ({ id: u.id, title: u.title, steps: unitSteps(u) })),
          currentQuestion: () => state.quizQuestion,
          answerCorrect:   () => debugAnswer(true),
          answerWrong:     () => debugAnswer(false),
          gotIt:           () => learnGotIt(),
          switchMode:      (mode) => switchMode(mode),
          resetProgress:   () => resetProgress(),
          useHint:         () => learnHint(),
          setKeyContext:   (on) => setKeyContext(on),
          intervalRefs:    INTERVAL_REFS,
          get instrument() { return instrumentId; },
          instrumentIds:   INSTRUMENT_IDS,
          chooseInstrument: (id) => chooseInstrument(id),
          setLearnMix:     (on) => setLearnMix(on),
          // Wait until one instrument's samples have loaded (true) or failed (false).
          loadInstrument:  (id) => instrument(id).loaded.then(() => instruments[id].ready),
          // [lo, hi] MIDI notes a random pick will use the instrument for.
          instrumentRange: (id) => instrumentRange(id),
          playChord:       (midis) => playChord(midis),
          // Render the song card for an interval into the visible panel.
          showRefs: (dir, semis) => {
            const low = 60, down = dir === 'down';
            const q = { kind: 'interval', mode: down ? 'descending' : 'ascending', semis,
                        low, high: low + semis, midis: down ? [low + semis, low] : [low, low + semis] };
            renderIntervalRefs(q, qEl('refs'));
            if (state.mode === 'learn') document.getElementById('learn-result').hidden = false;
          },
          // What the current interval question's prompt plays (null otherwise).
          promptEvents:    () => (state.quizQuestion && state.quizQuestion.kind === 'interval'
            ? intervalPromptEvents(state.quizQuestion, progress.settings.keyContext) : null),

          // ── Learn game layer ──
          // Force one question variant for Learn rounds ('standard', 'song',
          // 'odd', 'wrong-note', 'count', 'video', 'blind', 'phrase', 'complete',
          // 'missing'), or null for the normal random mix. Variants a unit
          // can't serve fall back to the mix.
          forceVariant:    (v) => { state.forcedVariant = v || null; return true; },
          variantsFor:     (unitId, step) => {
            const u = LEARN_UNITS.find(x => x.id === unitId);
            return u && u[step] ? (LEARN_VARIANTS[step][u[step].type] || []).map(([v]) => v)
              .filter(v => variantAvailable(u, step, v)) : [];
          },
          // The active boss/daily run (null when none): kind, idx, len, correct,
          // lives, ended, won, xp, bonus, left/limit (ms on the timer).
          get run()        { return state.learnRun; },
          get combo()      { return state.learnCombo; },
          viewStep:        (step) => viewLearnStep(step),
          startBoss:       () => { if (state.learnStep !== 'boss' || state.learnDaily) return false; startRun('boss'); return true; },
          playBoss:        (misses = 0) => debugPlayBoss(misses),
          expireTimer:     () => { if (!state.learnRun || !state.learnRun.timed) return false; timeUp(); return true; },
          startDaily:      () => enterDaily(),
          leaveDaily:      () => leaveDaily(),
          // Pretend today is this local date (YYYY-MM-DD), for streak tests.
          setToday:        (d) => { state.todayOverride = d || null; renderLearnStats(); },
          setSfx:          (on) => setSfx(on),
          // Sing mode without asking for the mic (askMic false), and a sung note.
          setSing:         (on, askMic = false) => setSing(on, askMic),
          sing:            (midi) => judgeSung(midi),
          // Begin a sing round on fixed notes (root MIDI, semitones up).
          singRound:       (root, semis) => {
            if (state.mode !== 'learn' || state.learnRun) return false;
            const q = makeSingQuestion([semis], root);
            q.unitId = LEARN_UNITS[state.learnUnitIdx].id;
            beginRound(q);
            return true;
          },
          singStatus:      () => ({ listening: !!sing.q, mic: !!sing.analyser,
                                    note: document.getElementById('learn-sing-note').textContent }),
          detectPitch:     (freq, sampleRate = 48000) => {
            const buf = new Float32Array(2048);
            for (let i = 0; i < buf.length; i++) buf[i] = 0.5 * Math.sin(2 * Math.PI * freq * i / sampleRate);
            return detectPitch(buf, sampleRate);
          },
        };
      }

      // Install prompt
      let installPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        installPrompt = e;
        document.getElementById('install-btn').classList.add('visible');
      });
      document.getElementById('install-btn').addEventListener('click', async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        const { outcome } = await installPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('install-btn').classList.remove('visible');
          installPrompt = null;
        }
      });

      // Service Worker
      if ('serviceWorker' in navigator) {
        const SW_VERSION = '2610310948';
        navigator.serviceWorker.register(
          `/music-theory/sw.js?v=${encodeURIComponent(SW_VERSION)}`,
          { scope: '/music-theory/' }
        ).then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById('update-banner').classList.add('visible');
              }
            });
          });
        });
        document.getElementById('update-btn').addEventListener('click', () => {
          navigator.serviceWorker.getRegistration().then(reg => {
            if (reg && reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
          });
          window.location.reload();
        });
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
