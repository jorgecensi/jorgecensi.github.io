---
layout: wrapper
title: Topics
lang: en
ref: search
---
{% assign t = site.data.translations.en %}
<h1>{{ t.search_page.heading }}</h1>
<p>{{ t.search_page.subtitle }}</p>

<div class="tag-section">
{% for tag in site.tags %}
<h3 id="{{ tag[0] | slugify }}">{{ tag[0] }}</h3>
<ul>
    {% for post in tag[1] %}
    <li><a href="{{ post.url }}">{{ post.title }}</a></li>
    {% endfor %}
</ul>
{% endfor %}
</div>
