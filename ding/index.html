<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ding">
    <meta name="theme-color" content="#1a1410">
    <meta name="description" content="A tap bell for answering questions: ring once for yes, twice for no.">
    <title>Ding</title>
    <link rel="manifest" href="/ding/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/ding-icon-192.png">
    <link rel="apple-touch-icon" href="/img/ding-icon-192.png">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #1a1410;
            --text-dim: #a8977f;
            --brass:    #deaa40;
            --safe-top:    env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body { height: 100%; }

        body {
            background: radial-gradient(circle at 50% 45%, #2e241b 0%, var(--bg) 70%);
            color: var(--text-dim);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        #app {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
        }

        #bell {
            background: none;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            width: min(88vw, 62vh, 520px);
            aspect-ratio: 1;
            border-radius: 24px;
        }

        #bell:focus-visible { outline: 4px solid var(--brass); outline-offset: 6px; }

        #bell svg { width: 100%; height: 100%; overflow: visible; }

        /* Plunger drops when pressed; dome wobbles while it rings */
        #plunger { transition: transform 0.05s ease; }
        #bell.pressed #plunger { transform: translateY(14px); }

        #dome { transform-origin: 256px 380px; }
        #bell.ring #dome { animation: wobble 0.45s ease-out; }

        @keyframes wobble {
            0%   { transform: rotate(0); }
            20%  { transform: rotate(-3deg); }
            45%  { transform: rotate(2.2deg); }
            70%  { transform: rotate(-1deg); }
            100% { transform: rotate(0); }
        }

        #waves path { opacity: 0; }
        #bell.ring #waves path { animation: wave 0.6s ease-out; }
        #bell.ring #waves path:nth-child(2n) { animation-delay: 0.05s; }

        @keyframes wave {
            0%   { opacity: 0.9; transform: scale(0.9); }
            100% { opacity: 0; transform: scale(1.15); }
        }

        #waves { transform-origin: 256px 110px; }
        #waves path { transform-origin: 256px 110px; }

        .hint { font-size: 0.95rem; letter-spacing: 0.04em; text-align: center; }
    </style>
</head>

<body>
    <div id="app">
        <button id="bell" aria-label="Ring the bell">
            <svg viewBox="56 30 400 430" aria-hidden="true">
                <defs>
                    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#f7d27a"/>
                        <stop offset="0.45" stop-color="#deaa40"/>
                        <stop offset="1" stop-color="#9c6f1c"/>
                    </linearGradient>
                    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#3b2e24"/>
                        <stop offset="1" stop-color="#1f1812"/>
                    </linearGradient>
                </defs>

                <g id="waves" fill="none" stroke="#deaa40" stroke-width="10" stroke-linecap="round">
                    <path d="M196 70 Q176 100 196 130"/>
                    <path d="M316 70 Q336 100 316 130"/>
                    <path d="M160 50 Q128 100 160 150"/>
                    <path d="M352 50 Q384 100 352 150"/>
                </g>

                <g id="plunger">
                    <rect x="246" y="118" width="20" height="60" rx="4" fill="#b58a30"/>
                    <ellipse cx="256" cy="116" rx="38" ry="16" fill="url(#brass)"/>
                </g>

                <g id="dome">
                    <path d="M106 380 A150 150 0 0 1 406 380 Z" fill="url(#brass)"/>
                    <path d="M160 320 A110 110 0 0 1 220 250" fill="none" stroke="#fff1c7" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
                </g>

                <rect x="76" y="376" width="360" height="30" rx="12" fill="url(#brass)"/>
                <rect x="96" y="404" width="320" height="40" rx="12" fill="url(#base)"/>
            </svg>
        </button>

        <p class="hint">Once for yes · twice for no</p>
    </div>

    <script>
        const SW_VERSION = '2609290828';

        if ('serviceWorker' in navigator) {
            let hasRefreshedForUpdate = false;

            const askToUpdate = (registration) => {
                const shouldUpdate = window.confirm('A new Ding update is ready. Update now?');
                if (shouldUpdate && registration.waiting) {
                    registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
            };

            navigator.serviceWorker.register('/ding/sw.js?v=' + SW_VERSION)
                .then((registration) => {
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                if (!hasRefreshedForUpdate) {
                                    hasRefreshedForUpdate = true;
                                    askToUpdate(registration);
                                }
                            }
                        });
                    });
                });

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
            });
        }

        (() => {
            const bell = document.getElementById('bell');

            // ── Sound ─────────────────────────────────────────────
            // A desk/service bell: a bright strike plus a few inharmonic
            // partials that ring out and decay.
            let audioCtx = null;
            const getAudio = () => {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return null;
                    audioCtx = new Ctx();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            };

            const PARTIALS = [
                { ratio: 1,    gain: 0.55, decay: 1.6 },
                { ratio: 2.76, gain: 0.25, decay: 0.9 },
                { ratio: 5.40, gain: 0.12, decay: 0.5 },
                { ratio: 8.93, gain: 0.06, decay: 0.25 }
            ];

            const ding = () => {
                const ctx = getAudio();
                if (!ctx) return;
                const when = ctx.currentTime + 0.005;
                const out = ctx.createGain();
                out.gain.value = 0.5;
                out.connect(ctx.destination);
                PARTIALS.forEach((p) => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 1480 * p.ratio;
                    g.gain.setValueAtTime(0, when);
                    g.gain.linearRampToValueAtTime(p.gain, when + 0.004);
                    g.gain.exponentialRampToValueAtTime(0.0001, when + p.decay);
                    osc.connect(g).connect(out);
                    osc.start(when);
                    osc.stop(when + p.decay + 0.05);
                });
            };

            // ── Ringing ───────────────────────────────────────────
            // Ring on pointerdown (not click) so a quick double-tap for "no"
            // produces two crisp dings with no delay.
            const ring = () => {
                ding();
                if (navigator.vibrate) navigator.vibrate(40);
                bell.classList.remove('ring');
                void bell.offsetWidth; // restart the animation
                bell.classList.add('ring', 'pressed');
            };
            const release = () => bell.classList.remove('pressed');

            bell.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                ring();
            });
            bell.addEventListener('pointerup', release);
            bell.addEventListener('pointerleave', release);
            bell.addEventListener('pointercancel', release);
            bell.addEventListener('contextmenu', (e) => e.preventDefault());

            // Keyboard / switch access: Space or Enter rings it.
            document.addEventListener('keydown', (e) => {
                if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) {
                    e.preventDefault();
                    ring();
                }
            });
            document.addEventListener('keyup', release);

            // ── Keep the screen on ────────────────────────────────
            let wakeLock = null;
            const keepAwake = async () => {
                if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } catch (e) { /* denied or unsupported */ }
            };
            document.addEventListener('visibilitychange', keepAwake);
            document.addEventListener('pointerdown', keepAwake, { once: true });
            keepAwake();

        })();
    </script>
</body>

</html>
